<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo verde redondeado -->
  <rect width="32" height="32" rx="7" fill="#16a34a"/>

  <!-- Barras del gráfico -->
  <rect x="3"  y="22" width="5" height="7" rx="1" fill="rgba(255,255,255,0.65)"/>
  <rect x="10" y="17" width="5" height="12" rx="1" fill="rgba(255,255,255,0.8)"/>
  <rect x="17" y="12" width="5" height="17" rx="1" fill="white"/>
  <rect x="24" y="16" width="5" height="13" rx="1" fill="rgba(255,255,255,0.8)"/>

  <!-- Línea de tendencia -->
  <polyline
    points="5.5,19  12.5,14  19.5,9  26.5,13"
    stroke="#86efac"
    stroke-width="2"
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Punto en el máximo -->
  <circle cx="19.5" cy="9" r="2" fill="#4ade80"/>
</svg>
