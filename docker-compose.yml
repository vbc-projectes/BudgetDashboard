version: "3.9"

# Despliegue en server: copiar este archivo en /opt/dashboardeconomic/docker-compose.yml
# Arrancar con: docker compose pull && docker compose up -d

services:
  app:
    image: cpachecoperello/dashboardeconomic:latest
    container_name: dashboardeconomic
    restart: unless-stopped
    ports:
      # CAMBIAR: puerto externo si el 3000 ya está ocupado en el server (ej: "8080:3000")
      - "3000:3000"
    volumes:
      # Volumen gestionado por Docker (recomendado, datos en /var/lib/docker/volumes/)
      - dashboard_data:/app/usuarios
      # ALTERNATIVA: bind mount a ruta del server — descomentar y comentar la línea anterior
      # - /opt/dashboardeconomic/usuarios:/app/usuarios
    environment:
      NODE_ENV: production
      PORT: 3000
      USERS_ROOT: /app/usuarios
      # CAMBIAR: limita las filas devueltas por consulta si el server tiene poca RAM
      QUERY_LIMIT: 2000
      # CAMBIAR: pon el dominio o IP pública del server (ej: https://mi-dominio.com)
      CORS_ORIGIN: "*"

volumes:
  # Solo necesario si usas el volumen gestionado (no bind mount)
  dashboard_data:
    driver: local
